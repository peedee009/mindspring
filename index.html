
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>MindSpring | Learn Through Understanding</title>
<style>
:root {
  --navy:#102a43;
  --blue:#2463eb;
  --pale:#edf4ff;
  --ink:#243447;
  --muted:#62748a;
  --border:#dce5ef;
  --green:#16845b;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:#f4f7fb;
  color:var(--ink);
  font-family:Arial,sans-serif;
  line-height:1.65;
}
header {background:var(--navy);color:white;padding:20px}
.header-inner,main {max-width:850px;margin:auto}
header h1 {margin:0;font-size:27px}
header p {margin:3px 0 0;opacity:.85}
main {padding:25px 16px 45px}
.card {
  background:white;
  padding:22px;
  border:1px solid var(--border);
  border-radius:15px;
  margin-bottom:16px;
}
h2,h3 {color:var(--navy)}
h2 {margin-top:0}
.muted,.crumb {color:var(--muted)}
.crumb {font-size:13px;margin-bottom:12px}
button {
  border:0;
  border-radius:9px;
  padding:12px 17px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  margin:5px 5px 5px 0;
  background:var(--blue);
  color:white;
}
button.secondary {
  background:var(--pale);
  color:var(--navy);
  border:1px solid #d5e3ff;
}
button:disabled {opacity:.5;cursor:not-allowed}
.item,.choice {
  display:block;
  width:100%;
  text-align:left;
  padding:15px;
  margin:9px 0;
  background:white;
  color:var(--ink);
  border:1px solid var(--border);
  border-radius:11px;
}
.item strong {display:block;color:var(--navy)}
.item small {color:var(--muted);font-weight:400}
.choice.selected {border:2px solid var(--blue);background:var(--pale)}
.notice {
  background:var(--pale);
  border-left:4px solid var(--blue);
  padding:13px;
  border-radius:7px;
  margin:14px 0;
}
.success {
  background:#e9f7f0;
  border-left:4px solid var(--green);
  padding:13px;
  border-radius:7px;
  margin:14px 0;
}
.progress {
  height:8px;
  background:#e5ebf3;
  border-radius:20px;
  overflow:hidden;
  margin:15px 0;
}
.progress span {
  display:block;
  height:100%;
  background:var(--blue);
}
.lesson-step {
  border:1px solid var(--border);
  border-radius:10px;
  padding:15px;
  margin:12px 0;
}
footer {
  text-align:center;
  color:var(--muted);
  padding:20px;
  font-size:13px;
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>MindSpring</h1>
    <p>From confusion to understanding.</p>
  </div>
</header>

<main><div id="app"></div></main>
<footer>MindSpring Prototype · Learning through understanding</footer>

<script>
const app = document.getElementById("app");

/* CURRICULUM */
const curriculum = {

        ],
        diagnostic:["In 5x + 2 = 12, what is the coefficient of x?",["2","5","12","x"],1],

        ],

          ["Opposite numbers","+4 and -4 are opposites. They have equal sizes but opposite signs.","Moving four steps forward and then four steps backward brings you back to where you started."],
          ["Why do they make zero?","Starting at zero, adding 4 takes you to 4. Subtracting 4 takes you back to zero.","Therefore, +4 - 4 = 0. Their combined value is zero."]
        ],
        diagnostic:["What is +7 - 7?",["14","7","0","-7"],2],

      },
      {

        intro:"Learn how one mathematical operation can undo another.",
        lessons:[
          ["Addition and subtraction","Subtraction reverses addition. If you add 4 to a number, subtracting 4 takes you back to the original number."],
          ["Multiplication and division","Division reverses multiplication. If a number is multiplied by 3, dividing it by 3 reverses the operation."],
          ["Using inverse operations","To solve an equation, our goal is to leave the unknown variable alone.","We use the opposite operation to undo what is happening to the variable."]
        ],
        diagnostic:["Which operation reverses multiplication by 5?",["Addition by 5","Subtraction by 5","Division by 5","Multiplication by 5"],2],
        practice:["Which operation reverses subtraction by 8?",["Addition by 8","Multiplication by 8","Division by 8","Subtraction by 8"],0,"Addition by 8 reverses subtraction by 8."]
      },
      {
        title:"One-step equations",
        intro:"Learn how to isolate an unknown variable using one operation.",
        lessons:[
          ["Look at the equation","Consider x + 4 = 9.","Our goal is to find x. We want x to remain alone on one side."],
          ["Identify the operation","The variable x has 4 added to it.","To undo addition by 4, we use subtraction by 4."],
          ["Keep both sides balanced","Subtract 4 from both sides: x + 4 - 4 = 9 - 4.","We subtract from both sides because an equation must remain balanced."],
          ["Understand cancellation","Look at +4 - 4. Positive 4 and negative 4 are opposites.","Their combined value is zero. So +4 - 4 = 0, leaving x + 0."],
          ["Simplify","Adding zero does not change a number. Therefore x + 0 = x.","On the right, 9 - 4 = 5. We are left with x = 5."],
          ["Check your answer","Put 5 back into the original equation.","5 + 4 = 9. Both sides are equal, so x = 5 is correct."]
        ],
        diagnostic:["Solve x + 4 = 9.",["x = 13","x = 5","x = 4","x = 9"],1],
        practice:["Solve x + 6 = 10.",["x = 16","x = 4","x = 6","x = 10"],1,"Subtract 6 from both sides: x = 10 - 6 = 4. Check: 4 + 6 = 10."]
      },
      {

    ],
    "Geometry": [
      {
        title:"Basic geometric shapes",
        intro:"Recognise common two-dimensional shapes.",

          ["Quadrilaterals","A quadrilateral is a polygon with four sides. Examples include squares, rectangles and parallelograms."]
        ],
        diagnostic:["How many sides does a triangle have?",["2","3","4","5"],1],
        practice:["How many sides does a quadrilateral have?",["3","4","5","6"],1,"A quadrilateral has four sides."]
      }
    ]
  },

      {

        ],
        diagnostic:["What is the main food produced during photosynthesis?",["Glucose","Oxygen","Water","Carbon dioxide"],0],

        ],
        diagnostic:["Which pigment absorbs light energy?",["Haemoglobin","Chlorophyll","Melanin","Keratin"],1],
        practice:["Which gas enters the leaf for photosynthesis?",["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],2,"Carbon dioxide enters through tiny openings called stomata."]
      },
      {
        title:"Products of photosynthesis",
        intro:"Photosynthesis produces substances that support plant life.",
        lessons:[

        ],
        diagnostic:["Which gas is released during photosynthesis?",["Nitrogen","Carbon dioxide","Oxygen","Hydrogen"],2],
        practice:["Which two main products are formed during photosynthesis?",["Water and carbon dioxide","Glucose and oxygen","Oxygen and nitrogen","Water and glucose only"],1,"Glucose is produced and oxygen is released."]
      }
    ],
    "Cell Biology": [
      {
        title:"Introduction to cells",
        intro:"Cells are the basic structural and functional units of living organisms.",
        lessons:[
          ["Cell theory","Living organisms are made of one or more cells. Cells are the basic units of life."],

        ],
        diagnostic:["What is the basic unit of life?",["Tissue","Organ","Cell","Organ system"],2],
        practice:["An organism made up of one cell is described as what?",["Multicellular","Unicellular","Non-cellular","Specialised"],1,"Unicellular means consisting of one cell."]
      }
    ]
  },

  "Physics": {
    "Forces and Motion": [
      {
        title:"Understanding force",
        intro:"A force is a push or pull that can affect the motion or shape of an object.",
        lessons:[
          ["Meaning of force","A force is an interaction that can change an object's motion or shape."],
          ["Direction","Forces act in particular directions. A push to the left and a push to the right act in opposite directions."],
          ["Measuring force","The SI unit of force is the newton (N)."]
        ],
        diagnostic:["What is the SI unit of force?",["Joule","Newton","Watt","Pascal"],1],
        practice:["Which description best defines a force?",["A push or pull","A type of energy","The size of an object","The speed of light"],0,"A force is a push or pull that can affect motion or shape."]
      },
      {
        title:"Types of forces",
        intro:"Forces can be grouped according to how objects interact.",
        lessons:[
          ["Contact forces","Contact forces act when objects touch. Examples include friction, tension and normal reaction."],
          ["Non-contact forces","These act without direct physical contact. Examples include gravitational, magnetic and electrostatic forces."],
          ["Compare them","Friction requires surfaces to touch, while gravity can act between separated objects."]
        ],
        diagnostic:["Which is a non-contact force?",["Friction","Tension","Gravity","Normal reaction"],2],
        practice:["Which force acts when two surfaces rub together?",["Friction","Gravity","Magnetism","Electrostatic force"],0,"Friction acts between surfaces in contact."]
      },
      {
        title:"Balanced and unbalanced forces",
        intro:"The combined effect of forces determines whether an object's motion changes.",
        lessons:[
          ["Balanced forces","Equal forces acting in opposite directions have a resultant force of zero."],
          ["Unbalanced forces","When forces do not balance, the resultant force is not zero. The object's motion can change."],
          ["Resultant force","The resultant force is the overall force after all the forces acting on an object are combined."]
        ],
        diagnostic:["What is the resultant force of equal opposite forces?",["Zero","One newton","Twice either force","The larger force"],0],
        practice:["What is the resultant when 8 N acts right and 3 N acts left?",["2 N right","5 N right","11 N right","5 N left"],1,"Subtract the opposing forces: 8 - 3 = 5 N to the right."]
      }
    ],
    "Energy": [
      {
        title:"Forms of energy",
        intro:"Energy is the capacity to do work or cause change.",
        lessons:[
          ["Kinetic energy","Kinetic energy is the energy associated with motion."],
          ["Potential energy","Potential energy is stored energy due to position or configuration."],
          ["Other forms","Thermal, chemical, electrical, light and sound energy are other forms of energy."]
        ],
        diagnostic:["What type of energy is associated with motion?",["Kinetic","Chemical","Potential","Nuclear"],0],
        practice:["Which is an example of stored energy due to position?",["Kinetic energy","Gravitational potential energy","Sound energy","Light energy"],1,"Gravitational potential energy depends on an object's position in a gravitational field."]
      }
    ]
  },

  "Chemistry": {
    "Elements and Compounds": [
      {
        title:"Elements",
        intro:"Elements are pure substances made of one type of atom.",
        lessons:[
          ["Meaning","An element is a pure substance that cannot be chemically broken down into simpler substances."],
          ["Atoms","An atom is the smallest unit of an element that retains its chemical identity."],
          ["Examples","Hydrogen, oxygen, carbon and iron are examples of elements."]
        ],
        diagnostic:["Which is an element?",["Water","Oxygen","Sodium chloride","Carbon dioxide"],1],

        lessons:[

      }
    ],

      {

        intro:"Chemical reactions involve the rearrangement of atoms to form new substances.",
        lessons:[
          ["Reactants","Reactants are the starting substances that take part in a chemical reaction."],

          ["Conservation of mass","In a chemical reaction, atoms are rearranged. In a closed system, total mass is conserved."]
        ],
        diagnostic:["What are the starting substances in a reaction called?",["Products","Reactants","Catalysts","Mixtures"],1],
        practice:["What are the new substances formed called?",["Reactants","Solvents","Products","Elements"],2,"Products are the substances formed by a chemical reaction."]

  "English Language": {
    "Grammar": [
      {

        lessons:[

          ["Adjectives and adverbs","An adjective describes a noun. An adverb commonly modifies a verb, adjective or another adverb."]
        ],
        diagnostic:["Which part of speech names a person, place or thing?",["Verb","Noun","Adjective","Adverb"],1],
        practice:["In 'The clever student reads', which word is an adjective?",["The","Clever","Student","Reads"],1,"Clever describes the noun student."]
      },
      {
        title:"Sentence construction",
        intro:"Learn how words combine to form meaningful sentences.",
        lessons:[
          ["Subject","The subject tells us who or what the sentence is about."],
          ["Predicate","The predicate tells us something about the subject and usually contains a verb."],
          ["Complete sentences","A complete sentence expresses a complete thought and has an appropriate grammatical structure."]
        ],
        diagnostic:["In 'The boy runs', what is the subject?",["Runs","The boy","The","Boy runs"],1],
        practice:["In 'The teacher explains the lesson', what is the verb?",["Teacher","Lesson","Explains","The"],2,"Explains expresses the action."]
      }
    ],
    "Comprehension": [
      {
        title:"Understanding passages",
        intro:"Comprehension involves reading, interpreting and evaluating written information.",
        lessons:[
          ["Main idea","The main idea is the central point or message of a passage."],
          ["Supporting details","Supporting details provide facts, examples or explanations that develop the main idea."],
          ["Inference","An inference is a conclusion drawn from clues in a passage and what the reader already knows."]
        ],
        diagnostic:["What is the central message of a passage called?",["Supporting detail","Main idea","Vocabulary","Punctuation"],1],
        practice:["A conclusion drawn from clues in a passage is called what?",["Inference","Title","Heading","Quotation"],0,"An inference is a conclusion based on clues and reasoning."]
      }

  }
};

let subject = "";
let topic = "";
let branch = 0;
let mode = "self";
let step = 0;
let selected = null;
let score = 0;
let completed = 0;

function render(html) {
  app.innerHTML = html;
  window.scrollTo({top:0,behavior:"smooth"});
}
function crumb(text) {
  return `<div class="crumb">${text}</div>`;
}
function btn(label,action,secondary=false) {
  return `<button class="${secondary?"secondary":""}" onclick="${action}">${label}</button>`;
}
function home() {
  render(`
    <section class="card">
      <h2>Welcome to MindSpring</h2>
      <p>Learning becomes easier when you understand the foundation behind each concept.</p>
      <p class="muted">Explore a subject, discover what you know and build your understanding step by step.</p>
      ${btn("Start Learning","showSubjects()")}
    </section>
  `);
}

/* SUBJECT SELECTION: THE FIRST LEARNING SCREEN */
function showSubjects() {
  render(`
    ${crumb("Home / Subjects")}
    <section class="card">
      <h2>Choose a subject</h2>
      <p class="muted">What would you like to learn today?</p>
      ${Object.keys(curriculum).map((name,i)=>`
        <button class="item" onclick="openSubject(${i})">
          <strong>${name}</strong>
          <small>${Object.keys(curriculum[name]).join(" · ")}</small>
        </button>
      `).join("")}
      ${btn("Back home","home()",true)}
    </section>
  `);
}
function openSubject(index) {
  subject = Object.keys(curriculum)[index];
  const topics = Object.keys(curriculum[subject]);
  render(`
    ${crumb("Subjects / "+subject)}
    <section class="card">
      <h2>${subject}</h2>
      <p class="muted">Choose a topic to explore.</p>
      ${topics.map((name,i)=>`
        <button class="item" onclick="openTopic(${i})">
          <strong>${name}</strong>
          <small>${curriculum[subject][name].length} learning branches</small>
        </button>
      `).join("")}
      ${btn("Back to subjects","showSubjects()",true)}
    </section>
  `);
}
function openTopic(index) {
  topic = Object.keys(curriculum[subject])[index];
  render(`
    ${crumb(subject+" / "+topic)}
    <section class="card">
      <h2>${topic}</h2>
      <div class="notice">
        <strong>Guide me</strong><br>
        Follow the learning branches in order, from foundational concepts onward.
      </div>
      ${btn("Guide me","startGuided()")}
      <div class="notice">
        <strong>Choose for myself</strong><br>
        Select the exact concept you want to study.
      </div>
      ${btn("Choose for myself","showSubtopics()")}
    </section>
    ${btn("Back to topics","openSubject("+Object.keys(curriculum).indexOf(subject)+")",true)}
  `);
}
function showSubtopics() {
  const list = curriculum[subject][topic];
  render(`
    ${crumb(subject+" / "+topic+" / Subtopics")}
    <section class="card">
      <h2>Choose a subtopic</h2>
      ${list.map((item,i)=>`
        <button class="item" onclick="begin(${i})">
          <strong>${i+1}. ${item.title}</strong>
          <small>${item.intro}</small>
        </button>
      `).join("")}
      ${btn("Back","openTopic("+Object.keys(curriculum[subject]).indexOf(topic)+")",true)}
    </section>
  `);
}
function startGuided() {
  mode="guided";
  begin(0);
}
function begin(index) {
  branch=index;
  step=0;
  selected=null;
  showDiagnostic();
}
function data() {
  return curriculum[subject][topic][branch];
}
function showDiagnostic() {
  const d=data(), q=d.diagnostic;
  render(`
    ${crumb(subject+" / "+topic+" / "+d.title)}
    <section class="card">
      <h2>Discover what you know</h2>
      <p>${d.intro}</p>
      <div class="notice">This question checks your starting point. It is okay if you do not know the answer yet.</div>
      <h3>${q[0]}</h3>
      ${q[1].map((o,i)=>`
        <button class="choice" id="opt${i}" onclick="choose(${i})">${o}</button>
      `).join("")}
      <div id="feedback"></div>
      ${btn("Check my answer","checkDiagnostic()")}
      ${btn("Back to subtopics","showSubtopics()",true)}
    </section>
  `);
}
function choose(i) {
  selected=i;
  document.querySelectorAll(".choice").forEach((el,j)=>el.classList.toggle("selected",i===j));
}
function checkDiagnostic() {
  if(selected===null) return alert("Choose an answer first.");
  const d=data(), correct=selected===d.diagnostic[2];
  if(correct) score++;
  document.getElementById("feedback").innerHTML=`
    <div class="${correct?"success":"notice"}">
      <strong>${correct?"Good start!":"That's okay. Let's understand it together."}</strong>
      <p>${correct?"You have recognised the concept.":"We will build the concept step by step in the lesson."}</p>
    </div>
    ${btn("Start lesson","showLesson()")}
  `;
  document.querySelectorAll(".choice").forEach(el=>el.disabled=true);
}
function showLesson() {
  const d=data(), lesson=d.lessons[step];
  render(`
    ${crumb(subject+" / "+topic+" / "+d.title)}
    <section class="card">
      <h2>${d.title}</h2>
      <p class="muted">${d.intro}</p>
      <div class="progress"><span style="width:${((step+1)/d.lessons.length)*100}%"></span></div>
      <p class="muted">Step ${step+1} of ${d.lessons.length}</p>
      <div class="lesson-step">
        <h3>${lesson[0]}</h3>
        ${lesson.slice(1).map(line=>`<p>${line}</p>`).join("")}
      </div>
      ${step>0?btn("Previous step","previousStep()",true):""}
      ${step<d.lessons.length-1
        ?btn("Continue","nextStep()")
        :btn("Continue to practice","showPractice()")}
      ${btn("Exit lesson","showSubtopics()",true)}
    </section>
  `);
}
function nextStep() {step++;showLesson();}
function previousStep() {step=Math.max(0,step-1);showLesson();}
function showPractice() {
  const d=data(),q=d.practice;
  selected=null;
  render(`
    ${crumb(subject+" / "+topic+" / Practice")}
    <section class="card">
      <h2>Strengthen your understanding</h2>
      <p>Try this new question without looking back at the lesson.</p>
      <h3>${q[0]}</h3>
      ${q[1].map((o,i)=>`
        <button class="choice" onclick="choose(${i})">${o}</button>
      `).join("")}
      <div id="practiceFeedback"></div>
      ${btn("Submit answer","checkPractice()")}
    </section>
  `);
}
function checkPractice() {
  if(selected===null) return alert("Choose an answer first.");
  const q=data().practice;
  const correct=selected===q[2];
  if(correct) score++;
  completed++;
  document.getElementById("practiceFeedback").innerHTML=`
    <div class="${correct?"success":"notice"}">
      <strong>${correct?"Well done!":"Keep learning."}</strong>
      <p>${q[3]}</p>
    </div>
    ${btn("Finish subtopic","finishSubtopic()")}
  `;
  document.querySelectorAll(".choice").forEach(el=>el.disabled=true);
}
function finishSubtopic() {
  const list=curriculum[subject][topic];
  const next=branch+1;
  const hasNext=next<list.length;
  render(`
    <section class="card">
      <h2>Subtopic completed</h2>
      <p>You have finished <strong>${data().title}</strong>.</p>
      <div class="success">Keep building your understanding one concept at a time.</div>
      ${mode==="guided"&&hasNext?btn("Continue guided learning","begin("+next+")"):""}
      ${btn("Choose another subtopic","showSubtopics()",true)}
      ${btn("Back to topics","openTopic("+Object.keys(curriculum[subject]).indexOf(topic)+")",true)}
      ${btn("Back to subjects","showSubjects()",true)}
    </section>
  `);
}
home();
</script>
</body>
</html>
